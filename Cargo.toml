[package]
name = "rs-fn-fingerprint"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Hyukjin LIM"]
description = "Fast, query-based fingerprints of Rust items and TOML tables"
license = "MIT"
repository = "https://github.com/lhj6102/rs-fn-fingerprint"
readme = "README.md"
keywords = ["fingerprint", "rust", "toml", "hash", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
proc-macro2 = "1"
quote = "1"
serde_json = "1"
sha2 = "0.10"
syn = { version = "2.0.119", features = ["full", "visit", "fold"] }
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
